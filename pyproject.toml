[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bphs-calc-service"
version = "1.0.0"
description = "Open Vedic Calc — generic BPHS calculation service"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"

dependencies = [
    "pyswisseph==2.10.3.2",
    # Exact pin, like pyswisseph above and for the same reason. This dependency
    # supplies the lunar node model default that decides where Rahu and Ketu are
    # (jhora.const._RAHU). The true and mean nodes differ by up to 1.98 degrees,
    # so an open bound let a routine resolve move every Rahu and Ketu with no
    # change in this repository. See bphs_core/utils.py (LUNAR_NODE_MODEL) and
    # tests/test_lunar_node_model.py; a bump belongs in its own reviewed change
    # that re-runs the Swiss goldens.
    #
    # It also supplies the position-flag word, and THAT is the one this pin has
    # already caught moving: 4.8.6 built 66386 and 4.8.7 builds 65810 (a
    # difference of 576 = FLG_NOGDEFL | FLG_NONUT), with no file here changed and
    # no golden able to see it, because the served longitudes are bit-identical
    # under FLG_TRUEPOS. The 4.8.6 -> 4.8.7 bump was taken deliberately, and the
    # declaration re-derived, in the reviewed change that moved this line; see
    # bphs_core/utils.py (POSITION_FLAGS) and tests/test_position_flags.py.
    "pyjhora==4.8.7",
    "numpy>=1.23.0",
    # pyjhora undeclared runtime deps -- imported by jhora/utils.py at module
    # load; do not remove while pyjhora is a dependency.
    "geocoder>=1.38.1",
    "timezonefinder>=6.0.0",
    "geopy>=2.4.1",
    "python-dateutil>=2.9.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pytz>=2024.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
    "pip-audit>=2.7.0",
    # The linter. Pinned to an exact version for the same reason every other
    # tool here is: a floating linter turns "someone else released a rule" into
    # a red build on an unrelated PR, and a new rule arriving unannounced is a
    # moving part in a gate. dependabot's `pip` ecosystem bumps it, which is the
    # moment to read what the new rules do.
    "ruff==0.16.4",
    # ci/tests/test_environment_convergence.py parses uv.lock to compare the
    # RESOLVED set against what is installed. stdlib tomllib arrives in 3.11,
    # which .python-version now pins — but requires-python still admits 3.10
    # (the lock is universal and forks at 3.11), so on a 3.10 environment the
    # parser must still be declared; the `python_version < '3.11'` marker keeps
    # it off the pinned 3.11 interpreter, which uses stdlib tomllib. It was
    # already present transitively via pip-audit; relying on that would make
    # this guard fail to collect the day that transitive changes, which is not
    # a dependency relationship worth having implicit.
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bphs_core*", "app*"]

[tool.ruff]
# This repository had NO Python linter at all. That absence was load-bearing in
# at least one place: ci/tests/test_subprocess_decoding.py records, in its KNOWN
# BOUNDS, that the evasion shapes it cannot reach would not be flagged by
# anything else either, "note this repository has no linter at all".
#
# Target the interpreter .python-version declares, rather than inferring one:
# the same single-declaration rule that governs every other environment input
# here (ci/tests/test_environment_convergence.py asserts the pair).
target-version = "py311"

[tool.ruff.lint]
# CONSERVATIVE BY CHOICE. pycodestyle errors and warnings, pyflakes, and import
# ordering -- the rules that catch a mistake rather than express a preference.
# Nothing opinionated (no bugbear, no pyupgrade, no naming rules): a lint gate
# whose first act is to rewrite a working tree teaches contributors to run it
# with --fix and stop reading it.
#
# WHAT "E" ACTUALLY BUYS HERE, measured rather than assumed. Under ruff 0.14.6
# (re-measured unchanged under 0.16.4 at the bump to that version)
# the pycodestyle WHITESPACE rules -- E1xx, E2xx, E3xx, including E225
# missing-whitespace-around-operator -- are PREVIEW-ONLY and are not enabled by
# `select = ["E"]`. Measured: `x=1` and `y = ( 1, 2 )` pass under `--select E`
# and produce three findings under `--select E --preview`. So the active
# pycodestyle set is E4 (imports), E7 (statements) and E9 (runtime/IO errors),
# with E5 excluded below. Preview is deliberately NOT turned on: a preview rule
# can change between patch releases, which would put back exactly the moving
# part the exact `ruff==` pin removes.
select = ["E", "F", "W", "I"]

# E501 (line-too-long) is DISABLED, and the reason is recorded rather than left
# as a bare entry. Measured on this tree at the default width: 552 violations,
# and 57 even at 120 columns (re-measured 2026-09-01, identical under both
# ruff 0.14.6 and 0.16.4, so the count is a property of this tree's prose, not
# of the linter version. It was 533 at introduction; the rise to 552 is this
# repo's prose accumulating on the base branch since, not a regression).
# Essentially all of them are prose -- this repository deliberately writes
# long single-line paragraphs in comments and docstrings, because that prose
# is where its measurements and rationale live, and
# ci/tests/test_stable_anchor_citations.py PARSES those chunks as its corpus.
# Reflowing 552 lines of it would be a large diff through text other guards
# read, in exchange for a property that is a preference rather than a defect.
# Line length is the one pycodestyle rule that cannot catch a mistake.
ignore = ["E501"]

[tool.ruff.lint.isort]
# `bphs_core`, `app` and `tests` are this project's own packages. Without this,
# `tests` in particular is resolved as third-party and sorted into the wrong
# block, which would make the gate demand an ordering that is simply wrong.
known-first-party = ["app", "bphs_core", "tests"]

[tool.coverage.run]
branch = true
source = ["app", "bphs_core"]
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
show_missing = true
# Coverage gate for the calc-service. Raised 90 -> 92 after the edge-case
# top-ups (measured 97.82% combined line+branch, branch=true), keeping a
# comfortable buffer below actual.
fail_under = 92
