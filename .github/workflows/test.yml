name: Tests

# Compiles pyswisseph and runs pytest — skipped for docs-only changes to save
# Actions minutes. The boundary gate (ci.yml) still runs on those changes.
# Also runs weekly (independent of any push/PR) so a newly disclosed CVE in a
# pinned dependency is caught even on a repo with no recent commits.
#
# Five jobs (this header said "three" while the file held four — recounted):
#   lint                      — ruff, the repository's only Python linter.
#   test                      — the fast suite on the Moshier fallback (no data
#                               files), plus the gate regression suite and the
#                               frozen-lock CVE scan.
#   swiss-ephemeris           — CALC-1: the SAME suite against the REAL Swiss
#                               ephemeris data files, which is what production
#                               runs on. Until this job existed, nothing
#                               automated had ever validated this engine against
#                               real ephemeris data.
#   production-image-ephemeris — builds the PRODUCTION image and re-asserts, from
#                               outside the build and as the serving user, that
#                               swisseph reads the baked data.
#   docker-test-image         — CALC-7: builds Dockerfile.test (frozen install).
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

# Least-privilege GITHUB_TOKEN. With no explicit block a job inherits the
# repository default token scope, which is read across EVERY scope (actions,
# checks, issues, packages, pull-requests, statuses, ...) — far more than this
# workflow uses. Every job only clones the repo: `test` runs pytest + pip-audit,
# `swiss-ephemeris` additionally fetches public data files over plain HTTPS (no
# credentials of any kind), and `docker-test-image` builds Dockerfile.test with
# push: false (its buildx layer cache uses the Actions cache service, which is
# authenticated by the runtime token, not GITHUB_TOKEN). Both of those also use
# actions/cache, likewise authenticated by the runtime token rather than
# GITHUB_TOKEN. So contents: read is the whole requirement —
# note that publish.yml, which genuinely pushes to GHCR, declares its own
# packages: write on the publishing job only. This matters more here than in a
# private repo: any fork can open a pull request, so every needless scope on the
# workflow token is reachable from an untrusted PR.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # This repository had NO Python linter at all until this job existed. That
    # absence was not neutral: ci/tests/test_subprocess_decoding.py records, in
    # its KNOWN BOUNDS, that the evasion shapes it cannot reach would not be
    # caught by anything else either — "note this repository has no linter at
    # all". The gate FAILS the job on any violation; there is no advisory mode,
    # because a lint result nobody has to act on is a lint result nobody reads.
    #
    # A separate job rather than a step on `test`, so "the tests pass but the
    # lint fails" is legible at a glance instead of one red X covering both. It
    # runs in parallel, so wall-clock does not grow.
    #
    # Skipped on the weekly schedule run for the same reason as every other job
    # here: nothing about the code changed, only the vulnerability database.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Read from .python-version, never inline — the same single
          # declaration the other jobs take, and ruff's own `target-version` in
          # pyproject.toml is set to match it.
          python-version-file: .python-version
      - name: Install uv, at the version the shipped images install
        # Same exact pin and same reason as the `test` job below, where the full
        # rationale is recorded once.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: The lockfile is FRESH (uv.lock still satisfies pyproject.toml)
        # `--frozen` below never consults pyproject.toml, so a dependency edit
        # committed without re-running `uv lock` would install, and lint, as
        # though it had not happened. See the `test` job for the measurement.
        run: uv lock --check
      - name: Install the FROZEN dependency set
        # ruff is pinned in uv.lock like everything else, so this job lints with
        # the same version a developer gets from `uv sync --frozen --extra dev`.
        # A floating linter turns someone else's release into a red build on an
        # unrelated PR.
        run: uv sync --frozen --extra dev
      - name: ruff check
        # No `--fix`, no `--exit-zero`: the job's verdict is the point. Config
        # (rule selection, the recorded E501 exclusion, first-party packages)
        # lives in pyproject.toml under [tool.ruff].
        run: uv run --frozen ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because this job runs `pytest ci/tests/` and
          # ci/tests/test_stable_anchor_citations.py VERIFIES the tree's one
          # SHA-pinned citation at its pinned commit (`git cat-file`). Measured:
          # a depth-1 clone cannot resolve that commit at all, and the guard
          # fails closed rather than skipping — so a shallow checkout here would
          # red the build, not quietly disarm the check.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          # Read from .python-version, never inline. uv.lock FORKS at
          # python_full_version 3.11 (numpy 2.2.6/2.4.6, timezonefinder
          # 8.2.0/8.2.5), so the interpreter is what collapses the lock to a
          # single resolve — a second declaration of it is a second chance to
          # test one side of that fork while shipping the other.
          python-version-file: .python-version
      - name: Install uv, at the version the shipped images install
        # THE INSTALLER IS PART OF THE RESOLVE. This used to be a bare
        # `python -m pip install --upgrade uv` on the front of the install step
        # below, floating to whatever was newest on the index at the moment the
        # job ran — while Dockerfile and Dockerfile.test both install uv from a
        # digest-pinned `FROM ghcr.io/astral-sh/uv:<version>@sha256:<digest>`
        # stage. So CI could resolve, sync and test the lock through a DIFFERENT
        # uv than the one that builds the shipped image: the same "the gate is
        # not running what ships" shape as the 13-package divergence recorded on
        # the next step, one layer further out.
        #
        # `version:` is EXACT and must equal the tag both Dockerfiles install —
        # never `latest` or `latest-known`, which re-resolve per run and are the
        # thing being removed. The Dockerfiles are the source of truth because
        # dependabot WATCHES them (its `docker` ecosystem parses FROM
        # instructions) and does not watch this input at all (its
        # `github-actions` ecosystem bumps an action's `uses:` ref, never the
        # value of an input to it). A pin nobody watches is a pin that rots, so
        # the equality is the maintenance mechanism: the image bump arrives on
        # its own schedule, ci/tests/test_environment_convergence.py goes red on
        # the disagreement, and this line has to follow inside the same reviewed
        # change. That test derives the expected value from the Dockerfiles and
        # pins no version literal of its own.
        #
        # Referenced by a full release tag rather than a bare major like every
        # sibling action here: measured 2026-08-21, astral-sh/setup-uv publishes
        # moving major tags for v1..v7 only while its current release is
        # v10.0.1, so `@v10` does not resolve. dependabot's github-actions
        # ecosystem bumps this ref.
        #
        # enable-cache is off deliberately. There was no uv cache here before,
        # and the action defaults it ON ("auto") on hosted runners — leaving it
        # unset would smuggle a new Actions cache, and a new failure mode, into
        # a change whose entire purpose is to remove a moving part.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: The lockfile is FRESH (uv.lock still satisfies pyproject.toml)
        # `--frozen` on the next step installs uv.lock exactly as committed and
        # NEVER consults pyproject.toml — so a dependency edit committed without
        # re-running `uv lock` is installed, tested and shipped as though it had
        # not happened, silently, because nothing fails. Measured 2026-08-21 on
        # a scratch copy of this repo's own pair, one pin edited in
        # pyproject.toml with uv.lock left byte-identical:
        #
        #   uv lock --check ......  exit 1, "the lockfile needs to be updated"
        #   uv export --frozen ...  exit 0   <- the silent pass
        #   uv export --locked ...  exit 2
        #
        # A SEPARATE step, not a flip of the install to `uv sync --locked`: the
        # shipped Dockerfile installs with `--frozen`, and this repo's rule is to
        # run the exact command CI runs rather than an equivalent — putting the
        # image and its gate on two different install paths would reintroduce a
        # divergence in the act of closing one. Placed before the install only so
        # a stale lock reports itself as a stale lock; it fails the job from
        # either position. Resolves offline (~1 ms) when the lock is fresh.
        run: uv lock --check
      - name: Install the FROZEN dependency set
        # `uv sync --frozen`, not `pip install -e ".[dev]"`. The old floating
        # install ignored uv.lock entirely and resolved whatever was newest at
        # run time: measured 2026-08-05 it differed from the shipped image on
        # 13 packages that actually ship (fastapi 0.141.1 vs 0.136.3, uvicorn
        # 0.52.1 vs 0.48.0, anyio, certifi, cffi, charset-normalizer, click,
        # idna, pytz, typing-extensions, websockets, annotated-types,
        # annotated-doc). The suite that gates every merge was certifying a
        # dependency set no deployment ever ran.
        run: uv sync --frozen --extra dev
      - name: The pytest configuration does not narrow collection
        # A PLAIN `python` step, deliberately, and BEFORE any pytest step.
        #
        # pytest takes arguments from places the run line does not show, and each
        # of them disarms the suite AND the pytest-resident guard that would have
        # caught it — the guard is simply among the tests that no longer run.
        # Measured on this repo:
        #
        #   addopts = "--collect-only" in pyproject.toml
        #     -> `pytest ci/tests/ -q` exit 0, 119 collected, 0 executed
        #   addopts = "-k 'not narrow'"
        #     -> exit 0, with the addopts guard itself deselected
        #   PYTEST_ADDOPTS='--collect-only' (a workflow-level `env:` block)
        #     -> `pytest ci/tests/ -q` exit 0, 119 collected, 0 executed, AND
        #        `pytest tests/ -q` exit 0, 912 collected, 0 executed with
        #        REQUIRE_SWISS_EPHEMERIS=1 still set — fixtures do not run during
        #        collection, so the fail-closed flag never evaluates
        #
        # None of those is catchable from inside pytest. This step reads its own
        # environment and parses these workflow files, as plain python, so nothing
        # in pytest's configuration can deselect, skip or no-op it.
        # ci/tests/test_swiss_ephemeris_job.py::test_a_workflow_step_runs_the_
        # standalone_collection_check fails if it is removed from every workflow.
        run: uv run --frozen python ci/check_pytest_collection.py --self-test && uv run --frozen python ci/check_pytest_collection.py
      - name: Run tests
        # Scheduled (weekly CVE-only) runs skip pytest — nothing about the code
        # changed, only the vulnerability database might have.
        #
        # `uv run --frozen pytest …` keeps the console-script form: the bare
        # `pytest` entry point does NOT put the CWD on sys.path, which is what
        # makes `from ci import …` fail in ci/tests/ and why those tests load
        # repo files by path. `python -m pytest` would quietly change that.
        #
        # THIS STEP COLLECTS THE ACCURACY MODULES BUT ASSERTS NOTHING IN THEM.
        # tests/test_swiss_ephemeris.py, tests/test_independent_reference_corpus.py
        # and tests/test_ayanamsa_zero_point.py are gated on the `swiss_ephemeris`
        # fixture, and this job deliberately has NO ephemeris data — so every one of
        # those tests SKIPS here and this job reports green having validated none of
        # them. That is intended (compiling and downloading the data twice per PR buys
        # nothing) but it makes the redundancy load-bearing rather than incidental:
        #
        #   the ONLY job that asserts the accuracy modules is `swiss-ephemeris` below.
        #
        # So a future edit that deletes that job, disables it, or merely narrows its
        # pytest target does not turn those assertions red — it turns them into skips
        # in the one job and nothing at all in the other, and the whole workflow stays
        # green while the external-authority accuracy gate has been switched off. Do
        # not "consolidate" the two jobs, and do not read this step's green as evidence
        # about accuracy. ci/tests/test_swiss_ephemeris_job.py parses this file and
        # fails on each of those mutations, including the narrowed-target one
        # (test_swiss_job_reaches_every_swiss_gated_module), and derives the protected
        # module set from the fixture itself so a new accuracy module is covered the
        # day it lands.
        if: github.event_name != 'schedule'
        run: uv run --frozen pytest tests/ -q
      - name: Run CI gate regression suite
        # ci/tests/ lives outside the tests/ tree by design (it tests the CI
        # gate script itself, not the calc engine) — pytest tests/ never
        # collects it. Without this step, a future edit that weakens
        # _FORBIDDEN in ci/check_no_proprietary_refs.py would pass CI green.
        if: github.event_name != 'schedule'
        run: uv run --frozen pytest ci/tests/ -q
      - name: Dependency vulnerability scan (pip-audit against the frozen lock)
        # Audits the EXACT production dependency set that ships in the image
        # (uv sync --frozen from uv.lock) — which, since the install step above
        # is itself frozen, is now also the set this job just tested.
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.frozen.txt
          uv run --frozen pip-audit --requirement requirements.frozen.txt

  swiss-ephemeris:
    name: Accuracy against real Swiss ephemeris data
    runs-on: ubuntu-latest
    # CALC-1. The `test` job above runs with NO ephemeris data files, so swisseph
    # silently substitutes its built-in Moshier analytical ephemeris and returns
    # plausible numbers — meaning this repo's entire automated suite had never once
    # validated the engine against the Swiss data files production is volume-mounted
    # with. A regression that only manifests with real data (a data-file-dependent
    # edge case, an off-by-epoch bug) could merge green.
    #
    # This job closes that: it fetches the four checksum-pinned data files, then runs
    # the WHOLE suite against them with REQUIRE_SWISS_EPHEMERIS=1, which makes
    # tests/test_swiss_ephemeris.py hard-FAIL rather than skip if swisseph turns out
    # to be on the fallback engine. Fail-closed throughout: a download failure, a
    # checksum mismatch, or an unpinned checksum all fail the job — never a warning,
    # because "the accuracy job went green on Moshier" is exactly the outcome this
    # exists to prevent. ci/tests/test_swiss_ephemeris_job.py parses this workflow and
    # fails if this job, its fetch step, or that env var goes missing.
    #
    # Skipped on the weekly schedule run for the same reason as the `test` job's
    # pytest step: nothing about the code or the data changed, only the CVE database.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Same single declaration as the `test` job above. The goldens were
          # recorded on the pinned interpreter against the pinned pyswisseph,
          # so letting the accuracy gate pick its own interpreter would have it
          # certify a resolve nothing ships. (Measured from uv.lock: pyswisseph
          # 2.10.3.2 publishes wheels for cp310/cp311 only, so anything newer
          # additionally falls back to an sdist build here.)
          python-version-file: .python-version

      # Cache keyed on the manifest, so changing a pinned checksum (or adding a
      # file) invalidates it — a stale cache can never satisfy a new pin. The
      # fetcher re-verifies every file on every run regardless of cache hit, so a
      # corrupted cache entry fails the job rather than being trusted.
      - name: Cache Swiss ephemeris data files
        uses: actions/cache@v6
        with:
          path: data/ephe
          key: swiss-ephe-${{ hashFiles('ci/swiss_ephemeris.json') }}

      - name: Self-test the checksum verifier
        # Ordering matters: a verifier that has stopped verifying must never get as
        # far as certifying the real download. These fixtures cover a mismatching
        # checksum, an unpinned (null) checksum, a missing file, a truncated file and
        # eight structurally invalid manifests.
        run: python ci/fetch_swiss_ephemeris.py --self-test

      - name: Fetch + verify the Swiss ephemeris data files
        run: python ci/fetch_swiss_ephemeris.py

      - name: Install uv, at the version the shipped images install
        # Same pin, same reason, as the `test` job above — where the full
        # rationale (why exact, why the Dockerfiles are the source of truth, why
        # a full release tag, why the cache stays off) is recorded once. It
        # matters most HERE: this is the accuracy gate, and the goldens are only
        # reproducible against a pinned resolve, which means pinning the tool
        # that produces the resolve as well as the lock it produces it from.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.7"
          enable-cache: false

      - name: The lockfile is FRESH (uv.lock still satisfies pyproject.toml)
        # See the `test` job above for the measurement. `--frozen` cannot see a
        # stale lock, and this job of all jobs must not certify goldens against
        # a dependency set that pyproject.toml no longer asks for.
        run: uv lock --check

      - name: Install the FROZEN dependency set
        # uv sync --frozen, not `pip install -e .`: the committed golden values are
        # only reproducible against a pinned resolve (pyswisseph 2.10.3.2, pyjhora
        # 4.8.7 — the same set the shipped image installs). A floating resolve would
        # turn a dependency's own numeric change into a mystery golden failure.
        run: uv sync --frozen --extra dev

      - name: Run the full suite against real Swiss data
        env:
          # Turns "Swiss data is not active" from a skip into a hard failure. Without
          # it this job could pass while quietly testing nothing new.
          REQUIRE_SWISS_EPHEMERIS: "1"
        run: uv run --frozen python -m pytest tests/ -q

  production-image-ephemeris:
    name: Production image really ships (and reads) the Swiss data
    runs-on: ubuntu-latest
    # The Swiss ephemeris data files are BAKED into the production image (the
    # `ephemeris` stage in Dockerfile). Before that they were supplied by
    # nothing at all: the Dockerfile created an empty data/ephe and a comment
    # said it "must be volume-mounted", but no mount existed in any
    # environment — so a deployed instance computed on swisseph's Moshier
    # fallback, which never raises and returns plausible numbers.
    #
    # Nothing else in CI builds the PRODUCTION Dockerfile (docker-test-image
    # below builds Dockerfile.test), so without this job a broken fetch stage
    # would first surface on a deploy. ci/tests/test_image_bakes_ephemeris.py
    # checks the Dockerfile's STRUCTURE; this job checks the RESULT.
    #
    # The Dockerfile already fails its own build if swisseph does not read the
    # baked files. This job re-asserts it from OUTSIDE the build, because a
    # restored layer cache can satisfy an in-build RUN without re-executing
    # it, and because what must be true is a property of the final image.
    # Skipped on the weekly schedule run — same rationale as the jobs above.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Same mirror.gcr.io routing as publish.yml — anonymous docker.io
          # pulls intermittently rate-limit on GitHub-hosted runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: calc-service:ephemeris-check
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,scope=production-image,mode=max
      - name: The four data files are IN the image
        run: |
          docker run --rm --entrypoint sh calc-service:ephemeris-check -c '
            set -e
            for f in sepl_18.se1 semo_18.se1 seas_18.se1 sefstars.txt; do
              test -s "/app/data/ephe/$f" || { echo "MISSING: $f"; exit 1; }
            done
            ls -l /app/data/ephe'
      - name: swisseph actually READS them (retflag, not "it did not raise")
        # A Swiss request with the data files absent still SUCCEEDS — it
        # returns a plausible position with SEFLG_MOSEPH set instead of
        # SEFLG_SWIEPH. "The call worked" therefore proves nothing; only the
        # retflag bit does. Both Sun and Moon: the data set is split across
        # sepl_18.se1 (planets) and semo_18.se1 (Moon), and a Sun-only check
        # passes on a data set that leaves every nakshatra and dasha on the
        # fallback.
        run: |
          docker run --rm --entrypoint python calc-service:ephemeris-check -c '
          import sys
          import swisseph as swe
          from bphs_core.utils import probe_ephemeris_source
          failures = []
          for name, body in (("Sun", swe.SUN), ("Moon", swe.MOON)):
              active, retflag = probe_ephemeris_source(body=body)
              print(f"{name}: swiss_active={active} retflag={retflag} "
                    f"SWIEPH={bool(retflag & swe.FLG_SWIEPH)} "
                    f"MOSEPH={bool(retflag & swe.FLG_MOSEPH)}")
              if not active:
                  failures.append(name)
          if failures:
              sys.exit(f"the shipped image computes on the Moshier fallback for {failures}")
          print("OK: the production image reads its baked Swiss ephemeris data")'
      - name: The service refuses to start when that data is shadowed
        # Proves the boot guard is wired into the SERVED process, not merely
        # unit-tested. Mounting an empty directory over the baked data is
        # exactly what a re-added volume would do, and Docker creates an empty
        # one silently when the host path is absent. The container must die
        # rather than serve charts computed on the fallback.
        run: |
          mkdir -p "$RUNNER_TEMP/empty-ephe"
          if docker run --rm \
               -v "$RUNNER_TEMP/empty-ephe:/app/data/ephe:ro" \
               -e ENVIRONMENT=production \
               -e CALC_SERVICE_TOKEN=0123456789abcdef0123456789abcdef \
               --entrypoint python calc-service:ephemeris-check \
               -c 'import app.main'; then
            echo "::error::app.main imported cleanly with the ephemeris data shadowed — the boot guard is not wired into the served process"
            exit 1
          fi
          echo "Boot guard fired as required."

  docker-test-image:
    name: Build Dockerfile.test
    runs-on: ubuntu-latest
    # CALC-7: Dockerfile.test is what scripts/test-in-docker.* runs locally to
    # exercise real Swiss ephemeris data, and it installs from uv.lock with
    # `--frozen` (fails closed on any pyproject.toml/uv.lock drift). Nothing
    # else in CI builds this image, so without this job a frozen-install
    # regression here would only surface for a contributor running the local
    # Docker loop, not on the PR itself. Skipped on the weekly schedule run —
    # same rationale as the "Run tests" step above, nothing about the image
    # changed, only the vulnerability database might have.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Same mirror.gcr.io routing as publish.yml — anonymous docker.io
          # pulls (the python:3.11-slim base) intermittently rate-limit on
          # GitHub-hosted runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
