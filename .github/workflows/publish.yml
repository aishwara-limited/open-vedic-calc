name: Build and publish image

on:
  push:
    branches: [main]
    # Docs-only changes don't change the image — skip the build.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  release:
    types: [published]

# Least-privilege GITHUB_TOKEN, as the workflow DEFAULT. The `publish` job below
# already declares its own contents: read + packages: write (it logs in to GHCR
# and pushes), but the `test` job declared nothing and so inherited the
# repository default token scope — read across EVERY scope (actions, checks,
# issues, packages, pull-requests, statuses, ...), when all it does is clone and
# run pytest. Declaring the default here also means any job added later starts
# least-privilege and must opt in to more explicitly. A job-level block fully
# REPLACES this default, so `publish` keeps exactly the two scopes it declares.
# This matters more here than in a private repo: any fork can open a pull
# request, so every needless scope on the workflow token is reachable from an
# untrusted PR (and note `publish` is already `if: github.event_name !=
# 'pull_request'`, so the packages: write path never runs for one).
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same PR/branch, so the
# test job doesn't run to completion on every intermediate push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for the same reason test.yml's `test` job takes it:
          # this job runs `pytest ci/tests/`, and the stable-anchor guard
          # verifies the tree's SHA-pinned citation at its pinned commit, which
          # a depth-1 clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          # One declaration of the interpreter, shared with test.yml and both
          # Dockerfiles. uv.lock forks at python_full_version 3.11 (numpy
          # 2.2.6/2.4.6, timezonefinder 8.2.0/8.2.5), so which interpreter this
          # job runs decides which dependency SET it certifies — and this job
          # is the one enforcing the coverage gate that authorises the image
          # build below, so it above all must certify the set that image ships.
          python-version-file: .python-version
      # Install uv at the version the shipped images install, rather than the
      # bare `python -m pip install --upgrade uv` this used to carry, which
      # floated to whatever was newest on the index at run time. The full
      # rationale — why the version is exact, why the Dockerfiles' digest-pinned
      # `FROM ghcr.io/astral-sh/uv:<version>@sha256:<digest>` stage is the source
      # of truth, why a full release tag, why the cache stays off — is recorded
      # once in test.yml's `test` job. The argument is sharpest here: this job
      # enforces the coverage gate that AUTHORISES the image build below, so the
      # uv it resolves and tests with had better be the uv that builds it.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      # `--frozen` installs uv.lock as committed and never reads pyproject.toml,
      # so it cannot see a lock left stale by a dependency edit (measured — see
      # test.yml). This job gates the image build, and the image installs from
      # that same lock, so a stale one would ship.
      - run: uv lock --check
      # Install the FROZEN set, not a floating `pip install -e ".[dev]"`. This
      # job enforces the coverage gate that authorises the image build below,
      # so it of all jobs must be running the dependency set that image ships.
      - run: uv sync --frozen --extra dev
      # This job runs with the Moshier fallback (no Swiss ephemeris data files here);
      # line coverage is identical to a Swiss run — only numeric values differ, and
      # tests/test_swiss_ephemeris.py skips. It is NOT the accuracy gate: real Swiss
      # data is exercised by test.yml's `swiss-ephemeris` job (CALC-1), which fetches
      # the checksum-pinned data files and re-runs this same suite with
      # REQUIRE_SWISS_EPHEMERIS=1 so those tests hard-fail instead of skipping.
      # --cov enforces fail_under from pyproject [tool.coverage.report] (92).
      # `uv run --frozen pytest` keeps the console-script form the bare
      # `pytest` invocation had (no CWD on sys.path), which ci/tests/ relies on.
      - run: uv run --frozen pytest tests/ --cov --cov-report=term-missing
      # ci/tests/ lives outside the tests/ tree by design (it tests the CI
      # gate script itself, not the calc engine) — pytest tests/ never
      # collects it. Without this step, a future edit that weakens
      # _FORBIDDEN in ci/check_no_proprietary_refs.py would pass CI green
      # right up through the image build/publish path.
      - run: uv run --frozen pytest ci/tests/ -q

  publish:
    needs: test
    # Never publish from a pull request — main pushes and releases only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Boot BuildKit from Google's Docker Hub pull-through mirror, and route
          # every docker.io pull (incl. the python:3.11-slim base) through it.
          # Anonymous registry-1.docker.io pulls on GitHub-hosted runners
          # intermittently time out / rate-limit — run #11 failed booting
          # moby/buildkit ("Get https://registry-1.docker.io/v2/: context
          # deadline exceeded"). mirror.gcr.io is reliable and needs no auth.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Embed the exact source commit so /source returns the authoritative
          # cache key in production (the image is built without a .git dir, so
          # the in-container git rev-parse fallback can never fire).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
